<!-- Iconos de trazo editorial, 20×20 y con puntas cuadradas -->
<svg
  aria-hidden="true"
  viewBox="0 0 20 20"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="square"
  stroke-linejoin="miter"
  class="h-3.5 w-3.5 shrink-0"
>
  @switch (tipo()) {
    @case ('Seguimiento') {
      <!-- Sobre de vuelta -->
      <path d="M3 5.5h14v10H3zM3.5 6l6.5 5 6.5-5" />
    }
    @case ('Entrevista') {
      <!-- Dos bocadillos -->
      <path d="M3 3.5h9v6H7l-2.5 2v-2H3zM12 8.5h5v6h-1.5v2l-2.5-2H9v-2.5" />
    }
    @case ('PublicacionLinkedIn') {
      <!-- Megáfono -->
      <path d="M3.5 8.5h3l7-4v11l-7-4h-3zM6 11.5l1 4.5h2M16 8v4" />
    }
    @case ('Plazo') {
      <!-- Reloj de arena -->
      <path d="M5 3h10M5 17h10M6 3v3l4 4 4-4V3M6 17v-3l4-4 4 4v3" />
    }
    @default {
      <!-- Chincheta -->
      <path d="M7 3h6l-1 5 3 3H5l3-3zM10 11v6" />
    }
  }
</svg>
{{ etiqueta() }}
