<div class="flex flex-wrap items-center gap-x-2 gap-y-1">
  <!-- Contenedor fijo: los lectores de pantalla solo anuncian cambios en regiones que ya existían -->
  <!-- tabindex="-1": recibe el foco al pulsar «Reintentar», que desaparece y lo dejaría en <body> -->
  <div #indicador role="status" aria-live="polite" tabindex="-1" class="rounded-full outline-none">
    @switch (sistemaService.estado()) {
      @case ('conectada') {
        <p
          class="inline-flex items-center gap-2 rounded-full bg-emerald-50 px-3 py-1.5 text-sm font-medium text-emerald-800 ring-1 ring-emerald-200"
        >
          <span class="h-2 w-2 rounded-full bg-emerald-500" aria-hidden="true"></span>
          Conectado · modo {{ sistemaService.info()?.modo }}
        </p>
      }
      @case ('sin-conexion') {
        <p
          class="inline-flex items-center gap-2 rounded-full bg-red-50 px-3 py-1.5 text-sm font-medium text-red-800 ring-1 ring-red-200"
        >
          <span class="h-2 w-2 rounded-full bg-red-500" aria-hidden="true"></span>
          No se puede conectar con RadarEmpleo
        </p>
      }
      @default {
        <p
          class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1.5 text-sm font-medium text-slate-600 ring-1 ring-slate-200"
        >
          <span class="h-2 w-2 animate-pulse rounded-full bg-slate-400" aria-hidden="true"></span>
          Comprobando la conexión...
        </p>
      }
    }
  </div>

  @if (sistemaService.estado() === 'sin-conexion') {
    <button
      type="button"
      (click)="reintentar()"
      class="inline-flex min-h-12 items-center rounded-lg px-3 text-sm font-semibold text-primary underline hover:bg-primary-container focus-visible:ring-2 focus-visible:ring-primary focus-visible:outline-none"
    >
      Reintentar
    </button>
  }
</div>
