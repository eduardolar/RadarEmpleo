<!-- Sin el plugin de tipografía de Tailwind: cada etiqueta del HTML que llega por innerHTML tiene aquí
     su estilo con [&_etiqueta]. Por líneas: texto y títulos, listas, enlaces, código, citas y tablas.
     overflow-wrap: las URL largas de los informes no ensanchan la página. En las tablas las palabras
     no se parten a media letra (una columna no se queda en «Linkedi/n»), pero los enlaces sí, para que
     la tabla no se salga en el móvil. border-separate: con collapse no se redondean las esquinas -->
