<details
  class="group rounded-2xl"
  [class]="
    aspecto() === 'tarjeta'
      ? 'bg-surface-container-lowest ring-1 ring-outline-variant'
      : 'bg-surface-container'
  "
  [open]="abierta()"
>
  <!-- list-none y sin marcador: la flecha propia sustituye al triángulo del navegador -->
  <summary
    class="flex min-h-12 cursor-pointer list-none items-center justify-between gap-3 rounded-2xl px-4 py-2 font-semibold text-on-surface transition-colors group-open:rounded-b-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:outline-none motion-reduce:transition-none [&::-webkit-details-marker]:hidden"
    [class]="
      aspecto() === 'tarjeta' ? 'hover:bg-surface-container-low' : 'hover:bg-surface-container-high'
    "
  >
    <span class="min-w-0">{{ titulo() }}</span>
    <svg
      aria-hidden="true"
      viewBox="0 0 20 20"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      class="h-5 w-5 shrink-0 text-on-surface-variant transition-transform group-open:rotate-180 motion-reduce:transition-none"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="m5 7.5 5 5 5-5" />
    </svg>
  </summary>
  <ng-content />
</details>
