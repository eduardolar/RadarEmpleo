<!-- Siempre de tinta (#111827 de día, #0b1120 de noche): es la «portada» de la app. La sección
     activa va en un bloque gris (#1f2937) con una barra de lima a la izquierda y el icono en lima;
     el relleno de lima se reserva para el botón principal de cada pantalla (docs/DISENO.md).
     Colores planos, sin transparencias -->
<header
  class="fixed inset-y-0 left-0 z-20 hidden w-60 flex-col border-r-2 border-trazo bg-tinta-noche text-tinta-clara md:flex"
>
  <div class="border-b-2 border-tinta px-5 pt-6 pb-5">
    <div class="flex items-center gap-3">
      <img
        src="logo-radarempleo.svg"
        alt=""
        width="40"
        height="40"
        class="h-10 w-10 shrink-0 rounded-md"
      />
      <p class="font-display text-2xl leading-none font-extrabold tracking-tight text-papel">
        Radar<span class="text-fosforito">Empleo</span>
      </p>
    </div>
    <!-- El eslogan como un comentario de código: la barra doble es decoración -->
    <p class="mt-3 font-mono text-[0.6875rem] tracking-tight text-tinta-clara">
      <span aria-hidden="true" class="text-fosforito">// </span>¿La de trabajar te la sabes?
    </p>
  </div>

  <nav aria-label="Navegación principal" class="px-3 pt-4">
    <ul class="space-y-2">
      @for (opcion of opciones; track opcion.ruta) {
        @let activa = seccionActiva() === opcion.ruta;
        <li>
          <a
            [routerLink]="opcion.ruta"
            [class]="
              activa ? 'bg-tinta shadow-[inset_4px_0_0_0_var(--re-fosforito)]' : 'hover:bg-tinta'
            "
            [attr.aria-current]="activa ? 'page' : null"
            class="group flex items-center gap-3 rounded-md px-3 py-2 pl-4 transition-colors focus-visible:ring-3 focus-visible:ring-fosforito focus-visible:ring-offset-2 focus-visible:ring-offset-tinta-noche focus-visible:outline-none motion-reduce:transition-none"
          >
            <span
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-sm transition-colors motion-reduce:transition-none"
              [class]="
                activa
                  ? 'bg-tinta-noche text-fosforito'
                  : 'bg-tinta text-tinta-clara group-hover:text-fosforito'
              "
            >
              <app-icono-menu class="h-5 w-5" [icono]="opcion.icono" />
            </span>
            <span class="flex min-w-0 flex-col">
              <span
                class="font-display text-base leading-tight font-extrabold"
                [class]="activa ? 'text-fosforito' : 'text-papel'"
                >{{ opcion.etiqueta }}</span
              >
              <span
                class="truncate text-xs"
                [class]="activa ? 'font-medium text-papel' : 'text-tinta-clara'"
                >{{ opcion.descripcion }}</span
              >
            </span>
          </a>
        </li>
      }
    </ul>
  </nav>
</header>
