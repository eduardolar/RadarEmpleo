<nav
  aria-label="Navegación principal"
  class="fixed inset-x-0 bottom-0 z-30 border-t border-white/10 bg-slate-950/95 pb-[env(safe-area-inset-bottom)] backdrop-blur-lg md:hidden"
>
  <ul class="grid grid-cols-5 gap-1 px-1 py-1">
    @for (opcion of opciones; track opcion.ruta) {
      @let activa = seccionActiva() === opcion.ruta;
      <li>
        <a
          [routerLink]="opcion.ruta"
          [class.text-white]="activa"
          [attr.aria-current]="activa ? 'page' : null"
          class="flex min-h-14 flex-col items-center justify-center gap-1 rounded-xl px-1 py-1.5 text-xs font-medium text-slate-400 transition hover:text-white focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:outline-none"
        >
          <span
            class="flex h-7 w-12 items-center justify-center rounded-full transition"
            [class.bg-blue-400/15]="activa"
            [class.text-blue-300]="activa"
          >
            <app-icono-menu class="h-5 w-5" [icono]="opcion.icono" />
          </span>
          <span>{{ opcion.etiqueta }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
