<!-- La página ocupa el alto de la ventana para poder centrar el estado vacío en el área de trabajo
     (un poco por encima del centro). Sin cajas: el contenido va directamente sobre el fondo -->
<section class="flex min-h-[calc(100dvh-11rem)] flex-col gap-6 md:min-h-[calc(100dvh-3rem)]">
  <!-- En el móvil no hay menú lateral: la marca se presenta aquí, en la primera pantalla -->
  <div class="flex items-center gap-3 md:hidden">
    <img
      src="logo-radarempleo.svg"
      alt=""
      width="44"
      height="44"
      class="h-11 w-11 shrink-0 rounded-md border-2 border-trazo shadow-dura-sm"
    />
    <div class="min-w-0">
      <p class="font-display text-2xl leading-none font-extrabold tracking-tight text-on-surface">
        Radar<span class="bg-fosforito pr-0.5 text-on-fosforito">Empleo</span>
      </p>
      <p class="mt-1.5 font-mono text-xs text-on-surface-variant">
        <span aria-hidden="true">// </span>¿La de trabajar te la sabes?
      </p>
    </div>
  </div>

  <!-- El estado de la API, discreto, al lado del título -->
  <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-3">
    <app-cabecera-pagina titulo="Hoy" descripcion="Recordatorios, seguimientos y avisos del día." />
    <app-estado-api />
  </div>

  <!-- Estado vacío, centrado y sin marco: la taza del café de la mañana (el icono de Hoy) con el
       radar de la marca, en un bloque de lima (sus colores no cambian con el modo), y dos salidas -->
  <div class="flex flex-1 items-center justify-center pb-[8vh]">
    <div class="flex w-full max-w-xl flex-col items-center text-center">
      <svg aria-hidden="true" viewBox="0 0 120 120" class="h-28 w-28">
        <rect x="8" y="8" width="108" height="108" rx="6" class="fill-on-surface" />
        <rect
          x="3"
          y="3"
          width="108"
          height="108"
          rx="6"
          class="fill-fosforito stroke-on-fosforito"
          stroke-width="3"
        />
        <path
          d="M47 22c-4 5 4 9 0 15M59 18c-4 5 4 9 0 15M71 22c-4 5 4 9 0 15"
          fill="none"
          class="stroke-on-fosforito"
          stroke-width="3"
          stroke-linecap="round"
        />
        <rect
          x="22"
          y="88"
          width="72"
          height="9"
          rx="2"
          class="fill-papel stroke-on-fosforito"
          stroke-width="3"
        />
        <path
          d="M80 54h6a9 9 0 0 1 0 18h-6"
          fill="none"
          class="stroke-on-fosforito"
          stroke-width="4"
          stroke-linecap="round"
        />
        <path
          d="M32 46h48v20a20 20 0 0 1-20 20h-8a20 20 0 0 1-20-20V46Z"
          class="fill-papel stroke-on-fosforito"
          stroke-width="3"
          stroke-linejoin="round"
        />
        <rect x="47" y="56" width="18" height="18" rx="2" class="fill-on-fosforito" />
        <path
          d="M56 65v-6M56 65l4.5-4.5"
          class="stroke-papel"
          stroke-width="2"
          stroke-linecap="round"
        />
        <rect x="58" y="67" width="4" height="4" class="fill-fosforito" />
      </svg>
      <p class="mt-6 font-display text-3xl font-extrabold text-on-surface">
        Aquí se juntará lo del día.
      </p>
      <p class="mt-2 max-w-md text-base text-on-surface-variant">
        Los seguimientos, las entrevistas y los avisos de tus candidaturas saldrán en esta página.
      </p>
      <p class="mt-3 font-mono text-sm font-medium text-on-surface-variant">
        De momento, café tranquilo.
      </p>
      <!-- Una sola acción principal (el relleno) y una secundaria con borde -->
      <div class="mt-8 flex w-full flex-col gap-3 sm:w-auto sm:flex-row">
        <a mat-flat-button routerLink="/rastreos">Buscar nuevas ofertas</a>
        <a mat-stroked-button routerLink="/tablero">Ir al tablero</a>
      </div>
    </div>
  </div>
</section>
