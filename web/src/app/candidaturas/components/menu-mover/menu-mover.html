<!-- Botón de icono «⋮» en la esquina de la tarjeta: es la alternativa con teclado y en el móvil al
     arrastrar. 48 px de zona de toque (la de mat-icon-button) y el nombre en el aria-label -->
<button
  mat-icon-button
  type="button"
  class="text-on-surface"
  [matMenuTriggerFor]="menu"
  [attr.aria-label]="'Mover a otro estado: ' + descripcion()"
>
  <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
    <rect x="8.25" y="3" width="3.5" height="3.5" />
    <rect x="8.25" y="8.25" width="3.5" height="3.5" />
    <rect x="8.25" y="13.5" width="3.5" height="3.5" />
  </svg>
</button>
<mat-menu #menu="matMenu" xPosition="before">
  <!-- Rótulo solo visual: el botón ya dice qué es -->
  <p aria-hidden="true" class="etiqueta px-4 pt-2 pb-1 text-on-surface-variant">Mover a…</p>
  @for (destino of destinos(); track destino.estado) {
    <button mat-menu-item type="button" (click)="elegir.emit(destino.estado)">
      <span class="inline-flex items-center gap-2.5">
        <span
          aria-hidden="true"
          class="h-2.5 w-2.5 shrink-0 rounded-full bg-estado"
          [attr.data-estado]="destino.estado"
        ></span>
        {{ destino.etiqueta }}
      </span>
    </button>
  }
</mat-menu>
