<h2 mat-dialog-title>{{ candidatura ? 'Editar candidatura' : 'Nueva candidatura' }}</h2>
<mat-dialog-content>
  @if (conflicto(); as mensaje) {
    <!-- tabindex: recibe el foco para que se vea aunque el formulario estuviera desplazado -->
    <div
      #avisoConflicto
      role="alert"
      tabindex="-1"
      class="mt-2 rounded-md border-2 border-error bg-error-container px-4 py-3 text-sm text-on-error-container"
    >
      <p class="[overflow-wrap:anywhere]">{{ mensaje }}</p>
      <p class="mt-1">Si recargas, lo que has escrito aquí no se guarda.</p>
      <button mat-stroked-button type="button" class="mt-2 min-h-11" (click)="recargar()">
        Recargar la ficha
      </button>
    </div>
  }
  <!-- Margen arriba: si no, la etiqueta del primer campo outline queda cortada bajo el título -->
  <app-formulario-candidatura
    #formulario
    class="pt-2"
    [inicial]="candidatura"
    [rapido]="!candidatura"
    [guardando]="guardando()"
    [erroresServidor]="erroresServidor()"
    [conBotones]="false"
    (guardar)="guardar($event)"
  />
</mat-dialog-content>

<!-- Fijos abajo aunque el formulario se desplace. form="..." los asocia al <form> del formulario:
     el clic y el Intro desde cualquier campo lo envían igual que si estuvieran dentro -->
<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="guardando()" (click)="cerrarSinGuardar()">
    Cancelar
  </button>
  <button
    mat-flat-button
    type="submit"
    disabledInteractive
    [attr.form]="formulario.idFormulario"
    [disabled]="guardando()"
  >
    {{ guardando() ? 'Guardando...' : textoGuardar }}
  </button>
</mat-dialog-actions>
