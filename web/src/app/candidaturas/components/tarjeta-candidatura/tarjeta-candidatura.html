<!-- data-estado: la franja de la izquierda y el chip toman el color del estado (styles.css) -->
<!-- has-[a:focus-visible]: el foco del enlace se ve en toda la tarjeta, no solo en el título -->
<article
  [attr.data-estado]="candidatura().estado"
  class="tarjeta-candidatura relative overflow-hidden rounded-xl bg-surface-container-lowest py-3 pr-2 pl-4 shadow-sm ring-1 ring-outline-variant transition-shadow hover:shadow-md has-[a:focus-visible]:ring-2 has-[a:focus-visible]:ring-primary"
  [attr.aria-label]="candidatura().puesto + ' en ' + candidatura().empresa"
>
  <span aria-hidden="true" class="absolute inset-y-0 left-0 w-1 bg-estado"></span>

  <div class="flex items-start justify-between gap-2 pr-1">
    <p class="min-w-0 truncate text-xs font-medium text-on-surface-variant">
      {{ candidatura().empresa }}
    </p>
    <!-- En el PC ya lo dice la columna; en la lista del móvil, «Todas» mezcla estados -->
    <span
      class="inline-flex shrink-0 items-center gap-1 rounded-full bg-estado-suave px-2 py-0.5 text-xs font-medium text-on-estado ring-1 ring-estado-borde md:hidden"
    >
      <span aria-hidden="true" class="h-1.5 w-1.5 rounded-full bg-estado"></span>
      {{ etiquetaEstado() }}
    </span>
  </div>

  <!-- En el móvil el enlace cubre toda la tarjeta (max-md:after:inset-0): se abre la ficha tocando
       en cualquier parte. En el PC no, para no abrirla al soltar una tarjeta arrastrada -->
  <h3 class="mt-0.5 pr-1 text-[0.9375rem] leading-snug font-semibold text-on-surface">
    <a
      [routerLink]="['/candidaturas', candidatura().id]"
      class="rounded-sm break-words hover:underline focus-visible:underline focus-visible:outline-none max-md:after:absolute max-md:after:inset-0"
    >
      {{ candidatura().puesto }}
    </a>
  </h3>

  @if (lugar()) {
    <p class="mt-1 flex items-center gap-1 pr-1 text-xs text-on-surface-variant">
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5 shrink-0">
        <path
          fill-rule="evenodd"
          d="M10 18s6-5.4 6-10a6 6 0 1 0-12 0c0 4.6 6 10 6 10Zm0-7.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"
          clip-rule="evenodd"
        />
      </svg>
      <span class="truncate">{{ lugar() }}</span>
    </p>
  }

  <div class="mt-2 flex items-center justify-between gap-2">
    <p class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1 text-xs">
      <span
        class="rounded-full px-2 py-0.5 font-medium"
        [class]="
          candidatura().encaje === 'Alto'
            ? 'bg-primary-container text-on-primary-container'
            : 'bg-surface-container-high text-on-surface-variant'
        "
      >
        {{ encaje() }}
      </span>
      <span
        title="Días en este estado"
        class="inline-flex items-center gap-1 text-on-surface-variant tabular-nums"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          class="h-3.5 w-3.5 shrink-0"
        >
          <circle cx="10" cy="10" r="7" />
          <path stroke-linecap="round" d="M10 6.5V10l2.5 1.5" />
        </svg>
        {{ dias() }}<span class="sr-only"> en este estado</span>
      </span>
    </p>
    <!-- relative z-10: por encima del enlace que cubre la tarjeta en el móvil -->
    <app-menu-mover
      class="relative z-10"
      [estado]="candidatura().estado"
      [descripcion]="candidatura().puesto"
      (elegir)="mover.emit($event)"
    />
  </div>
</article>
