<!-- Formulario suelto: centrado y con ancho contenido (docs/DISENO.md, «Maquetación de página») -->
<section class="mx-auto w-full max-w-2xl space-y-6">
  <app-cabecera-pagina
    titulo="Apuntar"
    descripcion="Pega el enlace de la oferta y pon la empresa y el puesto. El resto puede esperar."
  />

  <div class="rounded-2xl bg-surface-container-lowest p-5 pb-6 sm:p-8">
    <app-formulario-candidatura
      [rapido]="true"
      [guardando]="guardando()"
      [erroresServidor]="erroresServidor()"
      textoGuardar="Apuntar"
      (guardar)="guardar($event)"
    />
  </div>
</section>
